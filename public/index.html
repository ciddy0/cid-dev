<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c0e12" />
    <title>cid.dev</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <svg id="map" role="group" data-t-label="map"></svg>
    </main>
    <div id="label" role="status"></div>

    <svg hidden>
      <symbol id="arrow" viewBox="0 0 24 24">
        <path d="M2 12h18M11.5 4.5 19.5 12l-8 7.5" />
      </symbol>
      <symbol id="chart" viewBox="0 0 24 24">
        <path d="M5 21v-7M12 21V9M19 21V3" />
      </symbol>
    </svg>
    <nav id="menu" class="waiting" data-t-label="menu">
      <button data-go="view">
        <svg class="arrow" aria-hidden="true"><use href="#arrow" /></svg
        ><span data-t="view"></span>
      </button>
      <button data-go="resume">
        <svg class="arrow" aria-hidden="true" style="--turn: -45deg">
          <use href="#arrow" /></svg
        ><span data-t="resume"></span>
      </button>
      <button data-go="docs">
        <svg class="arrow" aria-hidden="true" style="--turn: 45deg">
          <use href="#arrow" /></svg
        ><span data-t="docs"></span>
      </button>
      <button data-go="settings">
        <svg class="arrow" aria-hidden="true" style="--turn: 90deg">
          <use href="#arrow" /></svg
        ><span data-t="settings"></span>
      </button>
    </nav>
    <button id="back" data-t-label="back" hidden>
      <svg class="arrow" aria-hidden="true"><use href="#arrow" /></svg>
    </button>
    <button id="over" data-t-label="stats" hidden>
      <svg class="arrow" aria-hidden="true"><use href="#chart" /></svg>
    </button>

    <section class="screen" id="resume" data-t-label="resume" hidden>
      <div class="jobs">
        <div class="strip"></div>
      </div>
    </section>
    <section class="screen" id="docs" data-t-label="docs" hidden>
      <div class="docs" data-t="docsCard"></div>
    </section>
    <section class="screen" id="stats" data-t-label="stats" hidden>
      <div class="stats">
        <div class="stepper">
          <button data-by="-1" data-t-label="previous"></button>
          <output aria-live="polite"></output>
          <button data-by="1" data-t-label="next"></button>
        </div>
        <p class="stat"><b></b><span></span></p>
        <p class="readout" aria-live="polite"></p>
        <div class="chart" role="img"></div>
        <div class="axis" aria-hidden="true"></div>
        <p class="caption"></p>
        <ul class="lines"></ul>
        <p class="note"></p>
      </div>
    </section>
    <section class="screen" id="settings" data-t-label="settings" hidden>
      <div class="settings">
        <div class="row" role="group" aria-labelledby="lang-name">
          <span id="lang-name" data-t="lang"></span>
          <span class="stepper" data-pref="lang">
            <button data-by="-1" data-t-label="previous"></button>
            <output aria-live="polite"></output>
            <button data-by="1" data-t-label="next"></button>
          </span>
        </div>
        <button
          class="row switch"
          role="switch"
          data-pref="night"
          data-t="night"
        ></button>
        <button
          class="row switch"
          role="switch"
          data-pref="colorblind"
          data-t="colorblind"
        ></button>
        <button
          class="row switch"
          role="switch"
          data-pref="coast"
          data-t="coast"
        ></button>
        <button
          class="row switch"
          role="switch"
          data-pref="motion"
          data-t="motion"
        ></button>
        <button
          class="row switch"
          role="switch"
          data-pref="sound"
          data-t="sound"
        ></button>
        <div class="row" role="group" aria-labelledby="volume-name">
          <span id="volume-name" data-t="volume"></span>
          <span class="stepper" data-pref="volume">
            <button data-by="-1" data-t-label="quieter"></button>
            <output aria-live="polite"></output>
            <button data-by="1" data-t-label="louder"></button>
          </span>
        </div>
      </div>
    </section>
    <p id="status" role="alert" hidden></p>
    <noscript><p class="status">The map needs JavaScript to draw.</p></noscript>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
