<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>cid.dev</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <svg id="map" role="group" data-t-label="map"></svg>
    </main>
    <div id="label" role="status"></div>

    <svg hidden>
      <symbol id="arrow" viewBox="0 0 24 24">
        <path d="M2 12h18M11.5 4.5 19.5 12l-8 7.5" />
      </symbol>
    </svg>
    <nav id="menu" data-t-label="menu">
      <button data-go="view">
        <svg class="arrow"><use href="#arrow" /></svg><span data-t="view"></span>
      </button>
      <button data-go="resume">
        <svg class="arrow" style="--turn: -45deg"><use href="#arrow" /></svg
        ><span data-t="resume"></span>
      </button>
      <button data-go="docs">
        <svg class="arrow" style="--turn: 45deg"><use href="#arrow" /></svg
        ><span data-t="docs"></span>
      </button>
      <button data-go="settings">
        <svg class="arrow" style="--turn: 90deg"><use href="#arrow" /></svg
        ><span data-t="settings"></span>
      </button>
    </nav>
    <button id="back" data-t-label="back" hidden>
      <svg class="arrow"><use href="#arrow" /></svg>
    </button>

    <!-- Every data-t and data-t-label names its words in js/lang.js. -->
    <section class="screen" id="resume" data-t-label="resume" hidden>
      <div class="jobs">
        <div class="strip"></div>
      </div>
    </section>
    <section class="screen" id="docs" data-t-label="docs" hidden>
      <div class="docs" data-t="docsCard"></div>
    </section>
    <section class="screen" id="settings" data-t-label="settings" hidden>
      <div class="settings">
        <div class="row" role="group" aria-labelledby="lang-name">
          <span id="lang-name" data-t="lang"></span>
          <span class="stepper" data-pref="lang">
            <button data-by="-1" data-t-label="previous"></button>
            <output aria-live="polite"></output>
            <button data-by="1" data-t-label="next"></button>
          </span>
        </div>
        <button class="row switch" role="switch" data-pref="night" data-t="night"></button>
        <button class="row switch" role="switch" data-pref="colorblind" data-t="colorblind"></button>
        <button class="row switch" role="switch" data-pref="coast" data-t="coast"></button>
        <button class="row switch" role="switch" data-pref="motion" data-t="motion"></button>
        <button class="row switch" role="switch" data-pref="sound" data-t="sound"></button>
        <div class="row" role="group" aria-labelledby="volume-name">
          <span id="volume-name" data-t="volume"></span>
          <span class="stepper" data-pref="volume">
            <button data-by="-1" data-t-label="quieter"></button>
            <output aria-live="polite"></output>
            <button data-by="1" data-t-label="louder"></button>
          </span>
        </div>
      </div>
    </section>
    <p id="status" hidden></p>
    <noscript><p class="status">The map needs JavaScript to draw.</p></noscript>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
