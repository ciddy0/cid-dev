<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680"
     font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 16 12" refX="16" refY="6"
            markerWidth="16" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L16 6 L0 12 Z" fill="#000"/>
    </marker>
    <marker id="arrowSm" viewBox="0 0 12 9" refX="12" refY="4.5"
            markerWidth="12" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L12 4.5 L0 9 Z" fill="#000"/>
    </marker>
  </defs>

  <rect width="1240" height="680" fill="#FFFFFF"/>
  <rect x="22" y="22" width="1196" height="596" rx="18" fill="none" stroke="#000" stroke-width="2"/>

  <!-- ===== Browser panel ===== -->
  <rect x="65" y="106" width="200" height="470" rx="20" fill="#E2E2E2"/>
  <rect x="60" y="100" width="200" height="470" rx="20" fill="#EFEFEF" stroke="#000" stroke-width="2.5"/>

  <g transform="translate(122,138)">
    <path d="M6 84 v-10 a32 26 0 0 1 64 0 v10 z" fill="#5A5F6E" stroke="#2F2F2F" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="38" cy="24" r="16" fill="#E8A87C" stroke="#2F2F2F" stroke-width="2.5"/>
    <path d="M22 26 a16 16 0 0 1 32 0 a16 10 0 0 0 -32 0 z" fill="#2F2F2F"/>
    <rect x="23" y="54" width="30" height="22" rx="3" fill="#FFF" stroke="#2F2F2F" stroke-width="2.5"/>
    <circle cx="38" cy="65" r="2.6" fill="#2F2F2F"/>
    <path d="M14 76 h48 a4 4 0 0 1 4 4 a4 4 0 0 1 -4 4 h-48 a4 4 0 0 1 -4 -4 a4 4 0 0 1 4 -4 z"
          fill="#D5D8DE" stroke="#2F2F2F" stroke-width="2.5"/>
    <text x="38" y="108" text-anchor="middle" font-size="17" font-weight="700" fill="#000">Each visitor</text>
  </g>

  <g>
    <rect x="88" y="410" width="144" height="52" rx="10" fill="#F2A9AA" stroke="#000" stroke-width="2.5"/>
    <text x="160" y="442" text-anchor="middle" font-size="17" font-weight="700" fill="#000">trains.js</text>
  </g>
  <g>
    <rect x="88" y="482" width="144" height="62" rx="10" fill="#F6F6F6" stroke="#000" stroke-width="2.5"/>
    <text x="160" y="507" text-anchor="middle" font-size="17" font-weight="700" fill="#000">
      <tspan x="160" dy="0">timetable.js</tspan>
      <tspan x="160" dy="1.25em">(fallback)</tspan>
    </text>
  </g>

  <rect x="85" y="76" width="150" height="48" rx="24" fill="#000"/>
  <text x="160" y="108" text-anchor="middle" font-size="22" font-weight="700" fill="#FFF">Browser</text>

  <!-- ===== Cloudflare panel ===== -->
  <rect x="445" y="106" width="380" height="470" rx="20" fill="#E2E2E2"/>
  <rect x="440" y="100" width="380" height="470" rx="20" fill="#EFEFEF" stroke="#000" stroke-width="2.5"/>

  <g>
    <rect x="468" y="145" width="324" height="62" rx="12" fill="#FBE9C3" stroke="#000" stroke-width="2.5"/>
    <text x="630" y="183" text-anchor="middle" font-size="21" font-weight="700" fill="#000">Static assets</text>
  </g>
  <g>
    <rect x="468" y="265" width="130" height="62" rx="12" fill="#96BCF9" stroke="#000" stroke-width="2.5"/>
    <text x="533" y="303" text-anchor="middle" font-size="21" font-weight="700" fill="#000">Worker</text>
  </g>
  <g>
    <rect x="640" y="250" width="152" height="290" rx="14" fill="#89DFA3" stroke="#000" stroke-width="3"/>
    <text x="716" y="310" text-anchor="middle" font-size="30" font-weight="700" fill="#000">
      <tspan x="716" dy="0">Live</tspan>
      <tspan x="716" dy="1.2em">hub</tspan>
    </text>
    <text x="716" y="400" text-anchor="middle" font-size="15" font-weight="700" fill="#000">
      <tspan x="716" dy="0">Durable Object</tspan>
      <tspan x="716" dy="1.6em">positions →</tspan>
      <tspan x="716" dy="1.25em">line, from, to</tspan>
      <tspan x="716" dy="1.6em">via metro.json</tspan>
    </text>
  </g>

  <rect x="534" y="76" width="192" height="48" rx="24" fill="#000"/>
  <text x="630" y="108" text-anchor="middle" font-size="22" font-weight="700" fill="#FFF">Cloudflare</text>

  <!-- ===== LA Metro ===== -->
  <g>
    <rect x="996" y="240" width="180" height="220" rx="12" fill="#F6F6F6" stroke="#000" stroke-width="2.5"/>
    <text x="1086" y="325" text-anchor="middle" font-size="21" font-weight="700" fill="#000">
      <tspan x="1086" dy="0">LA Metro</tspan>
      <tspan x="1086" dy="1.25em">API</tspan>
    </text>
    <text x="1086" y="395" text-anchor="middle" font-size="15" font-weight="700" fill="#000">
      <tspan x="1086" dy="0">api.metro.net</tspan>
      <tspan x="1086" dy="1.4em">no API key</tspan>
    </text>
  </g>

  <!-- ===== Edges ===== -->
  <!-- 1. assets -> browser -->
  <line x1="468" y1="176" x2="260" y2="176" stroke="#000" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="350" y="162" text-anchor="middle" font-size="19" font-weight="700" fill="#000">1. page + map</text>

  <!-- 2. browser -> worker -> hub -->
  <line x1="260" y1="296" x2="468" y2="296" stroke="#000" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="350" y="282" text-anchor="middle" font-size="19" font-weight="700" fill="#000">2. open /live</text>
  <line x1="598" y1="296" x2="640" y2="296" stroke="#000" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowSm)"/>

  <!-- 3. hub -> metro -->
  <line x1="792" y1="300" x2="996" y2="300" stroke="#000" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="908" y="286" text-anchor="middle" font-size="19" font-weight="700" fill="#000">3. one socket</text>

  <!-- 4. metro -> hub -->
  <line x1="996" y1="410" x2="792" y2="410" stroke="#000" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="908" y="372" text-anchor="middle" font-size="19" font-weight="700" fill="#000">
    <tspan x="908" dy="0">4. positions</tspan>
    <tspan x="908" dy="1.25em">every 3s</tspan>
  </text>

  <!-- 5. hub -> browser -->
  <line x1="640" y1="436" x2="232" y2="436" stroke="#000" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="350" y="398" text-anchor="middle" font-size="19" font-weight="700" fill="#000">
    <tspan x="350" dy="0">5. snapshot</tspan>
    <tspan x="350" dy="1.25em">every 5–10s</tspan>
  </text>

  <text x="620" y="658" text-anchor="middle" font-family="Lora, Georgia, 'Liberation Serif', serif"
        font-size="17" fill="#878787">Every Visitor Shares One Upstream Socket to LA Metro</text>
</svg>
